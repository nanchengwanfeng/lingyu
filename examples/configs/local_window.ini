# 局部窗口注意力示例配置
#
# 先复制 ../plugins/attention_local_window.py 到 plugins/ 再跑：
#   lingyu train --config examples/configs/local_window.ini --set data.data_dir=data1
#
# 窗口大小用环境变量（默认 512）：
#   set LINGYU_ATTN_WINDOW=1024          (Windows cmd)
#   $env:LINGYU_ATTN_WINDOW = "1024"     (PowerShell)

[model]
n_layer = 10
n_embd = 640
n_head = 10
n_kv_head = 2
block_size = 512
dropout = 0.05
tie_weights = true
attention = local_window

[train]
batch_size = 8
grad_accum = 1
max_steps = 100
learning_rate = 5e-4
min_lr = 5e-5
warmup_iters = 20
eval_interval = 0
ckpt_interval = 0
log_interval = 10
out_dir = out/local_window

[data]
data_dir = data1
tokenizer_path = data1/tokenizer.txt
vocab_size = 8192
