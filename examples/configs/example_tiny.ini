# ==========================================================================
#  示例配置：自定义模型（[model] type = tiny）
#
#  这是 docs/EXTENDING.md 的配套示例。模型实现见
#  examples/models/tiny_lm.py —— 一个刻意做得很小的「词袋」模型，
#  用来演示引擎的模型契约，不追求效果。
#
#  用法（先把示例复制进插件目录 plugins/，CLI 启动时会自动加载）：
#      copy examples\models\tiny_lm.py plugins\tiny_lm.py      # Windows
#      cp examples/models/tiny_lm.py plugins/tiny_lm.py         # macOS / Linux
#      lingyu plan  --config examples/configs/example_tiny.ini
#      lingyu train --config examples/configs/example_tiny.ini --device cpu \
#                   --set train.max_steps=50
# ==========================================================================

[model]
type        = tiny          # 注册表里的模型名（默认 lingyu）
n_layer     = 1
n_embd      = 64
n_head      = 4
n_kv_head   = 2
block_size  = 256

[train]
out_dir         = out/example_tiny
batch_size      = 4
grad_accum      = 1
max_steps       = 50
learning_rate   = 1e-3
min_lr          = 1e-4
warmup_iters    = 5
lr_decay_iters  = 50
eval_interval   = 25
eval_iters      = 4
log_interval    = 5
ckpt_interval   = 50
sample_interval = 0
device          = cpu

[data]
data_dir      = data
tokenizer_path = data/tokenizer.txt

[sample]
prompt          = 他抬起头
max_new_tokens  = 20
temperature     = 0.9
