name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src gui tests

  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      LINGYU_GUI_NO_PROBE: "1"
      LINGYU_GUI_NO_ANIM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 fonts-noto-cjk
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install package
        run: pip install -e ".[dev,gui]"
      - name: Run tests
        run: python -m pytest tests -q --timeout=300 --junitxml=report.xml || true
      - name: Report test failures
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          summary = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def emit(text):
              print(text)
              if summary:
                  try:
                      with open(summary, "a", encoding="utf-8") as fh:
                          fh.write(text + "\n")
                  except OSError:
                      pass

          if not os.path.exists("report.xml"):
              emit("::error title=pytest report missing::report.xml 没有生成，测试步骤可能提前崩溃")
              sys.exit(1)

          try:
              root = ET.parse("report.xml").getroot()
          except Exception as exc:  # noqa: BLE001
              emit("::error title=pytest report unreadable::%s" % exc)
              sys.exit(1)

          total = 0
          bad = []
          for case in root.iter("testcase"):
              total += 1
              for tag in ("failure", "error"):
                  node = case.find(tag)
                  if node is not None:
                      message = (node.get("message") or "").strip().splitlines()
                      head = message[0][:400] if message else tag
                      bad.append((case.get("classname"), case.get("name"), head))

          emit("### pytest: %d 个用例，%d 个失败" % (total, len(bad)))
          for cls, name, msg in bad:
              emit("- `%s::%s` - %s" % (cls, name, msg))
              safe = msg.replace("::", ": ").replace("\n", " ")
              print("::error title=%s::%s :: %s" % (name, cls, safe))

          sys.exit(1 if bad else 0)
          PY
