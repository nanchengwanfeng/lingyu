# ==========================================================================
#  灵语 —— 聊天模型配置（一条配置跑完「预训练 → SFT → chat」）
#
#  和 small.ini 的区别：这就是给「能聊天」准备的档位。
#     1. 预训练 3000 步（约 3 个 epoch，7.9M token 语料）—— 先学会说人话
#     2. SFT 2000 步（Alpaca-GPT4 中文指令数据）—— 再学会「回答问题」
#     3. 最后用  lingyu chat --config configs/chat.ini  对话
#
#  三条命令：
#      lingyu train --config configs/chat.ini     # 第 1 步：预训练
#      lingyu sft   --config configs/chat.ini     # 第 2 步：监督微调
#      lingyu chat  --config configs/chat.ini     # 第 3 步：聊
#
#  ⚠️ 数据准备（只需要做一次）：
#     预训练语料：data/（语料准备页的默认输出；准备方法见《命令手册》prepare 一节）
#                如果你的语料在 data1/ 之类别处，加 --set data.data_dir=data1
#     SFT 数据  ：external_data/alpaca_gpt4_zh.jsonl
#                 来自 ModelScope 的 AI-ModelScope/alpaca-gpt4-data-zh
#                 （CC BY-NC 4.0，脚本与说明见 chat/fetch_sft_data.py）
#
#  ⚠️ 13M 的参数只够「验证流程 + 学个雏形」：
#     能按中文问答格式回话，但知识面和长回答都很有限。
#     想要像样的聊天，把 n_layer/n_embd 放大（medium/wide 档）并用更多语料重训。
# ==========================================================================

[model]
# 16 层 × 256 宽 ≈ 13.08M 参数，8GB 显存随便跑
n_layer     = 16
n_embd      = 256
n_head      = 8
n_kv_head   = 2
block_size  = 512           # 对话上下文 512 token 够用；想更长改这里（显存会涨）
d_ff        = 0             # 0 = 自动（8/3 × n_embd）
dropout     = 0.05
tie_weights = true
bias        = false

# --------------------------------------------------------------------- 预训练
[train]
batch_size          = 16
grad_accum          = 1
max_steps           = 3000        # 约 3 个 epoch（16×512=8192 token/步）
learning_rate       = 1e-3
min_lr              = 1e-4
warmup_iters        = 100
eval_interval       = 500
eval_iters          = 20
log_interval        = 50
ckpt_interval       = 1000
out_dir             = out/chat_pretrain
sample_while_train  = false

[data]
# 出厂默认和其它配置一致：语料准备页（packaged 版）写的就是 <runtime>/data。
# 如果你的语料在别处（例如老实验目录 data1/），用 --set 覆盖：
#   lingyu train --config configs/chat.ini --set data.data_dir=data1
data_dir = data
# tokenizer_path 不写 = 自动用 data_dir/tokenizer.txt

# ------------------------------------------------------------------- SFT 微调
[post]
method        = sft
data_path     = external_data/alpaca_gpt4_zh.jsonl
template      = plain       # data1 的分词器没有 chatml 特殊 token，用中文标记模板
system_prompt = 你是灵语，一个乐于助人的中文 AI 助手。
max_seq_len   = 512
batch_size    = 16
max_steps     = 2000
learning_rate = 3e-4
eval_interval = 250
log_interval  = 50
ask_interval  = 500
ckpt_interval = 500
out_dir       = out/chat_sft

# --------------------------------------------------------------------- 采样
[sample]
max_new_tokens = 160
temperature    = 0.7
top_p          = 0.9
