# ==========================================================================
#  灵语训练配置 —— nano65（最小档，实测 12.6M 参数，见下方说明）
#
#  名字里的 65 是参照「另一台机器上那个 6.5M 模型」起的，但本引擎架构不同，
#  实际参数量不一样，如实说明：
#
#      按词表 8192 实测：总参数 12.6 M
#      按词表 4096 实测：总参数 11.0 M
#      按词表 6000 实测：总参数 11.8 M
#
#  为什么下不到 6.5M：
#      词表本身就很贵（词表 × 宽度 × 2）。词表 8192 + 宽度 384，
#      光 embedding 就 8192×384 ≈ 3.1M；再加上 6 层注意力 2.4M、
#      前馈 7.1M，合计 12.6M。
#      想更小只有三条路：① 砍词表 ② 砍宽度 ③ 砍层数 —— 但都会明显伤效果。
#
#  想知道你自己的词表下是多少：  python -m lingyu params --config configs/nano65.ini
#
#  怎么用：
#      python -m lingyu train --config configs/nano65.ini
#      临时改一项又不想动文件：  --set model.n_layer=8
#
#  名词速查：
#      n_layer  层数       堆几层 Transformer（越深越会「推理」）
#      n_embd   宽度       每层内部有多少个数字通道（越宽越能记细节）
#      n_head   注意力头数  把宽度切几份，各自关注不同的东西
#      n_kv_head KV 头数    控制 KV cache 大小，越小越省（GQA）
#      block_size 上下文   模型一次能看多少个 token
#      batch_size 批大小    一步同时看多少段文本
# ==========================================================================

[model]
# ---- 这三个是 nanoGPT 用户最常改的 ----
n_layer     = 6            # 层数
n_embd      = 384          # 宽度（要能被 n_head 整除，且 除以 n_head 得偶数）
n_head      = 6            # 注意力头数
block_size  = 256          # 上下文长度（token 数）

# ---- KV cache 控制：n_head : n_kv_head 就是省下的倍数 ----
n_kv_head   = 2            # 1=MQA最省 / 2=推荐 / 等于 n_head 就是普通 MHA

# ---- 其它 ----
d_ff        = 1024         # 前馈中间维度，0 = 自动（8/3 × n_embd，对齐 8）
dropout     = 0.0          # 丢弃率；小语料防过拟合可设 0.1
tie_weights = true         # 输入输出共用词嵌入矩阵，省一半 embedding 参数
bias        = false        # 线性层是否带偏置（现代做法一般不带）

# ---- MoE 稀疏专家（先用不到，保持 false）----
use_moe          = false
n_expert         = 4
n_expert_per_tok = 2
n_shared_expert  = 1
expert_d_ff      = 0       # 0 = 自动（d_ff 的一半）
moe_every        = 1

[train]
out_dir= out/nano65
batch_size      = 32       # 一步同时看多少段文本；显存不够就调小
grad_accum      = 1        # 梯度累积：等效批大小 = batch_size × grad_accum
max_steps       = 10000    # 训练总步数
learning_rate   = 1e-3     # 学习率（最大）
min_lr          = 1e-4     # 余弦衰减的终点
warmup_iters    = 200      # 预热步数
lr_decay_iters  = 10000    # 衰减到 min_lr 的步数
weight_decay    = 0.1
beta1           = 0.9
beta2           = 0.95
grad_clip       = 1.0
eval_interval   = 250      # 每多少步验证一次
eval_iters      = 50
log_interval    = 10       # 每多少步打印一次进度
ckpt_interval   = 500      # 每多少步存一次断点
sample_interval = 500      # 每多少步试写一段
sample_while_train = true
aux_loss_coef   = 0.01     # MoE 负载均衡损失系数
z_loss_coef     = 0.001    # MoE 路由 z-loss 系数
seed            = 1234

[data]
data_dir= data
tokenizer_path= data/tokenizer.txt

[sample]
prompt         = 他抬起头
max_new_tokens = 200
temperature    = 0.9
top_k          = 40
top_p          = 0.95
