# ==========================================================================
#  灵语训练配置 —— moe（稀疏专家档）
#
#  这是 medium 稠密档的「对照档」，用来验证 MoE 在小模型上到底划不划算。
#
#  实测参数量（下面是 lingyu params 的实测值）：
#      总参数   ≈ 58 M      ← 模型的总容量
#      激活参数 ≈ 37 M      ← 每个 token 实际只算这么多
#      稀疏比     1.58 倍
#  对比 medium 稠密档：总参数 55 M，但每个 token 都要算满 55 M。
#
#  结论预告（论文 arXiv 2605.13769 在 1500 万参数量级的实测）：
#      按「激活参数」比，MoE 赢；按「总参数」比，稠密略赢。
#      所以别指望 MoE 一定更好 —— 它的价值是「用同样的每-token 算力，
#      换到更大的总容量」。跑完和 medium 对比验证 loss 就知道了。
#
#  怎么用：
#      python -m lingyu params --config configs/moe.ini    # 先看参数量
#      python -m lingyu train  --config configs/moe.ini
# ==========================================================================

[model]
n_layer     = 8            # 层数
n_embd      = 512          # 宽度
n_head      = 8            # 注意力头数
block_size  = 512          # 上下文长度

n_kv_head   = 2            # GQA：KV cache 省 75%

d_ff        = 1536         # 共享专家（以及非 MoE 层）的中间维度
dropout     = 0.1          # MoE 参数多、更容易过拟合，建议开一点
tie_weights = true
bias        = false

# ---- MoE 开关：这一档的核心 ----
use_moe          = true
n_expert         = 8       # 8 个细粒度专家
n_expert_per_tok = 2       # top-2：论文实测 top-1 会立刻坍缩，top-2 才是质量来源
n_shared_expert  = 1       # 1 个永远激活的共享专家，装通用知识
expert_d_ff      = 256     # 每个专家的中间维度（细粒度 = 比全宽前馈小）
moe_every        = 1       # 每层都放 MoE

[train]
out_dir= out/moe
batch_size      = 16
grad_accum      = 1
max_steps       = 30000
learning_rate   = 8e-4
min_lr          = 8e-5
warmup_iters    = 400
lr_decay_iters  = 30000
weight_decay    = 0.1
beta1           = 0.9
beta2           = 0.95
grad_clip       = 1.0
eval_interval   = 500
eval_iters      = 50
log_interval    = 10
ckpt_interval   = 1000
sample_interval = 1000
sample_while_train = true
# ---- MoE 的两个辅助损失（默认值来自 DeepSeek 系列实践）----
aux_loss_coef   = 0.01     # 负载均衡：惩罚「某些专家被冷落」
z_loss_coef     = 0.001    # 路由 z-loss：防止路由 logit 过大、过早固化
seed            = 1234

[data]
data_dir= data
tokenizer_path= data/tokenizer.txt

[sample]
prompt         = 他抬起头，看着
max_new_tokens = 200
temperature    = 0.9
top_k          = 40
top_p          = 0.95
