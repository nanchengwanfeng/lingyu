# ==========================================================================
#  灵语训练配置 —— wide（约 55M 参数，试探 8GB 显存上限）
#
#  想换成别的档，直接改下面几行数值即可。
#
#  怎么用：
#      python -m lingyu train --config configs/nano65.ini
#      临时改一项又不想动文件：  --set model.n_layer=8
#
#  名词速查：
#      n_layer  层数       堆几层 Transformer（越深越会「推理」）
#      n_embd   宽度       每层内部有多少个数字通道（越宽越能记细节）
#      n_head   注意力头数  把宽度切几份，各自关注不同的东西
#      n_kv_head KV 头数    控制 KV cache 大小，越小越省（GQA）
#      block_size 上下文   模型一次能看多少个 token
#      batch_size 批大小    一步同时看多少段文本
# ==========================================================================

[model]
# ---- 这三个是 nanoGPT 用户最常改的 ----
n_layer     = 12            # 层数
n_embd      = 768          # 宽度（要能被 n_head 整除，且 除以 n_head 得偶数）
n_head      = 12            # 注意力头数
block_size  = 512          # 上下文长度（token 数）

# ---- KV cache 控制：n_head : n_kv_head 就是省下的倍数 ----
n_kv_head   = 2            # 1=MQA最省 / 2=推荐 / 等于 n_head 就是普通 MHA

# ---- 其它 ----
d_ff        = 0         # 前馈中间维度，0 = 自动（8/3 × n_embd，对齐 8）
dropout     = 0.1          # 丢弃率；小语料防过拟合可设 0.1
tie_weights = true         # 输入输出共用词嵌入矩阵，省一半 embedding 参数
bias        = false        # 线性层是否带偏置（现代做法一般不带）

# ---- MoE 稀疏专家（先用不到，保持 false）----
use_moe          = false
n_expert         = 4
n_expert_per_tok = 2
n_shared_expert  = 1
expert_d_ff      = 0       # 0 = 自动（d_ff 的一半）
moe_every        = 1

[train]
out_dir= out/wide
batch_size      = 16       # 一步同时看多少段文本；显存不够就调小
grad_accum      = 2        # 梯度累积：等效批大小 = batch_size × grad_accum
max_steps       = 40000    # 训练总步数
learning_rate   = 6e-4     # 学习率（最大）
min_lr          = 6e-5     # 余弦衰减的终点
warmup_iters    = 500      # 预热步数
lr_decay_iters  = 40000    # 衰减到 min_lr 的步数
weight_decay    = 0.1
beta1           = 0.9
beta2           = 0.95
grad_clip       = 1.0
eval_interval   = 500      # 每多少步验证一次
eval_iters      = 50
log_interval    = 10       # 每多少步打印一次进度
ckpt_interval   = 1000      # 每多少步存一次断点
sample_interval = 1000      # 每多少步试写一段
sample_while_train = true
aux_loss_coef   = 0.01     # MoE 负载均衡损失系数
z_loss_coef     = 0.001    # MoE 路由 z-loss 系数
seed            = 1234

[data]
data_dir= data
tokenizer_path= data/tokenizer.txt

[sample]
prompt         = 他抬起头，看着
max_new_tokens = 200
temperature    = 0.9
top_k          = 40
top_p          = 0.95
