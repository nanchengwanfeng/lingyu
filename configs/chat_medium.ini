# ==========================================================================
#  灵语 —— 聊天模型配置（medium 档，约 47.8M 参数）
#
#  chat.ini 是 13M 的「流程验证档」；这一份是真正能聊出点东西的档位。
#  同样是「一条配置跑完：预训练 → SFT → chat」：
#
#      lingyu train --config configs/chat_medium.ini    # 1) 预训练
#      lingyu sft   --config configs/chat_medium.ini    # 2) 监督微调
#      lingyu chat  --config configs/chat_medium.ini    # 3) 聊
#
#  ⚠️ 数据准备（只需要做一次）：
#     预训练语料：data/（语料准备页的默认输出；语料在 data1/ 就加
#                 --set data.data_dir=data1）
#     SFT 数据  ：external_data/alpaca_gpt4_zh.jsonl
#                 （chat/fetch_sft_data.py 一键下载 + 转换）
#
#  ⚠️ 47.8M 仍然是小模型：能听懂「问什么、怎么答」，知识面有限；
#     但比 13M 的 chat.ini 明显像样。显存需求约 4.5GB（batch 16 × 512）。
# ==========================================================================

[model]
# 10 层 × 640 宽 ≈ 47.8M 参数（medium 档），8GB 显存够用
n_layer     = 10
n_embd      = 640
n_head      = 10
n_kv_head   = 2
block_size  = 512           # 对话上下文 512 token；想更长改这里（显存会涨）
d_ff        = 0             # 0 = 自动（8/3 × n_embd）
dropout     = 0.05
tie_weights = true
bias        = false

# --------------------------------------------------------------------- 预训练
norm_eps = 1e-06
init_std = 0.02
residual_std = 0.02
attention = 
ffn = 
norm = 
pos = 
rope_base = 10000.0
use_moe = false
n_expert = 4
n_expert_per_tok = 2
n_shared_expert = 1
expert_d_ff = 0
moe_every = 1
moe_router_jitter = 0.0
shared_expert_gate = false
vocab_size = 0
[train]
batch_size          = 16
grad_accum          = 1
max_steps           = 3000        # 16×512=8192 token/步 → 约 2400 万 token（≈3 epoch）
learning_rate       = 0.0006
min_lr              = 6e-05
warmup_iters        = 200
lr_decay_iters      = 3000
weight_decay        = 0.1
beta1               = 0.9
beta2               = 0.95
grad_clip           = 1.0
eval_interval       = 500
eval_iters          = 20
log_interval        = 50
ckpt_interval       = 1000
out_dir             = out/chat_medium_pretrain
sample_while_train  = true
sample_interval     = 1000
seed                = 1234
aux_loss_coef = 0.01
z_loss_coef = 0.001
device = auto
amp_dtype = bf16
compile = false
num_workers = 0

[data]
# 出厂默认和其它配置一致：语料准备页写的就是 <runtime>/data。
# 语料在别处（例如老实验目录 data1/）就用 --set 覆盖：
#   lingyu train --config configs/chat_medium.ini --set data.data_dir=data1
data_dir = data
# tokenizer_path 不写 = 自动用 data_dir/tokenizer.txt

# ------------------------------------------------------------------- SFT 微调
tokenizer_path = 
val_ratio = 0.02
streaming = false
[post]
method        = sft
data_path     = external_data/alpaca_gpt4_zh.jsonl
template      = plain
system_prompt = 你是灵语，一个乐于助人的中文 AI 助手。请用简洁、准确的中文回答。
max_seq_len   = 512
batch_size    = 8
max_steps     = 6000        # batch 8 × 512 → 约 1 个 epoch（4.8 万条样本）
learning_rate = 0.0002
eval_interval = 500
log_interval  = 50
ask_interval  = 1000
ckpt_interval = 1000
out_dir       = out/chat_medium_sft
init_from = out/chat_medium_pretrain/best.pt
loss_on_prompt = false
lora_r = 8
lora_alpha = 16
lora_dropout = 0.05
lora_targets = q_proj,k_proj,v_proj,o_proj

[sample]
prompt         = 他抬起头，看着
max_new_tokens = 120
temperature    = 0.9
top_k          = 40
top_p          = 0.95
repetition_penalty = 1.05
seed = 0

[parallel]
backend = local
tensor_parallel = 1
pipeline_parallel = 1
expert_parallel = 1
zero_stage = 2
cpu_offload = false
activation_checkpoint = false
gradient_accum = 1
nccl_timeout_min = 30

[runtime]
lang = zh_CN
log_level = info
auto_exit_on_oom = false
monitor = console
